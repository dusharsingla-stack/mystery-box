<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Box Giveaway</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --box-bg: #333333;
            --box-hover: #444444;
            --box-selected: #212121;
            --accent-color: #4CAF50;
            --accent-light: #8BC34A;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .milestone-banner {
            background: #222;
            border: 1px dashed var(--accent-light);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--accent-light);
        }

        #verify-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .task-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }
        .task-btn.insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .task-btn.yt { background-color: #ff0000; }
        .task-btn.fb { background-color: #1877f2; }

        .verify-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #game-screen {
            display: none;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .box {
            background-color: var(--box-bg);
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-size: 0;
        }

        .box::before {
            content: '🎁';
            font-size: 35px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .box.locked {
            background-color: #2a2a2a;
            cursor: not-allowed;
            border: 2px dashed #555;
        }
        .box.locked::before {
            content: '🔒';
            opacity: 0.7;
        }

        .box.locked::after {
            content: attr(data-milestone);
            font-size: 9px;
            color: #ffcc00;
            position: absolute;
            bottom: 5px;
            background: rgba(0,0,0,0.8);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .box:hover:not(.locked) {
            background-color: var(--box-hover);
            transform: translateY(-3px);
        }

        .box.open {
            background-color: var(--box-selected);
            cursor: default;
            transform: none;
        }

        .box.open::before {
            opacity: 0;
        }

        .box.open::after {
            content: 'OPEN' !important;
            color: #888;
            font-weight: bold;
            font-size: 12px;
            position: absolute;
            bottom: auto !important;
            background: none !important;
        }

        #result-message {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 15px;
            line-height: 1.5;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .share-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .claim-btn {
            background-color: #E1306C;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="verify-screen">
            <h1>🔓 15 September 2026 Mystery Box</h1>
            <p style="font-size: 14px; color: #aaa; margin: 0 0 10px 0;">Complete the step below to access your box:</p>
            <div id="task-container"></div>
            <button class="verify-btn" onclick="verifyAndStart()">I have done it! Open Boxes</button>
        </div>

        <div id="game-screen">
            <h1>🎁 Choose 1 Mystery Box</h1>
            <div class="milestone-banner" id="milestone-text">
                🎯 Instagram Followers: <span id="current-followers-count">450</span> / 1,000
            </div>
            
            <div class="boxes-grid">
                <div class="box" data-id="1" data-target="100"></div>
                <div class="box" data-id="2" data-target="250"></div>
                <div class="box" data-id="3" data-target="400"></div>
                <div class="box" data-id="4" data-target="600"></div>
                <div class="box" data-id="5" data-target="750"></div>
                <div class="box" data-id="6" data-target="900"></div>
                <div class="box" data-id="7" data-target="1000"></div>
                <div class="box" data-id="8" data-target="1200"></div>
                <div class="box" data-id="9" data-target="1500"></div>
            </div>

            <div id="result-container">
                <div id="result-message"></div>
                <div id="action-area"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 15 SEPTEMBER 2026 EVENT SETTINGS (FINAL)
        // ==========================================
        const CURRENT_EVENT_ID = "event_15_sept_2026"; 
        const currentInstagramFollowers = 450; // Jaise followers badhein, yahan update karte rahein
        const TELEGRAM_CHANNEL_USERNAME = "tushquest"; 
        const INSTAGRAM_URL = "https://www.instagram.com/tushquest?igsi=MTE0amphM2J5eG8zZQ=="; 
        const YOUTUBE_CHANNEL_URL = "https://www.youtube.com/@TushQuest"; 
        const FACEBOOK_PAGE_URL = "https://www.facebook.com/share/1DtVuqGRqZ/"; 

        // Milestone & Level Based Prizes
        function getLevelBasedPrize() {
            const rand = Math.random() * 100;

            if (currentInstagramFollowers >= 1000) {
                if (rand < 1.5) return { name: "Grand Prize: Smartwatch!", isWinner: true };
                if (rand < 6) return { name: "₹500 Amazon Gift Card", isWinner: true };
                if (rand < 18) return { name: "₹100 Paytm Cash", isWinner: true };
                if (rand < 35) return { name: "Free T-shirt", isWinner: true };
                return { name: "Better Luck Next Time", isWinner: false };
            } else if (currentInstagramFollowers >= 500) {
                if (rand < 3) return { name: "₹100 Paytm Cash", isWinner: true };
                if (rand < 12) return { name: "₹50 Mobile Recharge", isWinner: true };
                if (rand < 30) return { name: "Mystery Discount Coupon", isWinner: true };
                return { name: "Better Luck Next Time", isWinner: false };
            } else {
                if (rand < 5) return { name: "₹20 Mobile Recharge", isWinner: true };
                if (rand < 20) return { name: "Special Sticker / Coupon", isWinner: true };
                return { name: "Better Luck Next Time", isWinner: false };
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const source = urlParams.get('source'); 
            const taskContainer = document.getElementById('task-container');

            let taskHTML = '';
            if (source === 'insta') {
                taskHTML = `<a href="${INSTAGRAM_URL}" target="_blank" class="task-btn insta">🟣 Follow on Instagram</a>`;
            } else if (source === 'yt') {
                taskHTML = `<a href="${YOUTUBE_CHANNEL_URL}" target="_blank" class="task-btn yt">🔴 Subscribe on YouTube</a>`;
            } else if (source === 'fb') {
                taskHTML = `<a href="${FACEBOOK_PAGE_URL}" target="_blank" class="task-btn fb">🔵 Follow on Facebook</a>`;
            } else {
                taskHTML = `
                    <a href="${INSTAGRAM_URL}" target="_blank" class="task-btn insta">🟣 Follow on Instagram</a>
                    <a href="${YOUTUBE_CHANNEL_URL}" target="_blank" class="task-btn yt">🔴 Subscribe on YouTube</a>
                    <a href="${FACEBOOK_PAGE_URL}" target="_blank" class="task-btn fb">🔵 Follow on Facebook</a>
                `;
            }
            taskContainer.innerHTML = taskHTML;

            document.getElementById('current-followers-count').textContent = currentInstagramFollowers;

            const boxes = document.querySelectorAll('.box');
            boxes.forEach(box => {
                const target = parseInt(box.getAttribute('data-target'));
                box.setAttribute('data-milestone', target + ' Insta');
                
                if (currentInstagramFollowers < target) {
                    box.classList.add('locked');
                } else {
                    box.classList.remove('locked');
                }
            });

            const savedEventData = localStorage.getItem('mysteryBoxPlayed_' + CURRENT_EVENT_ID);
            if (savedEventData) {
                showGameScreen();
                const savedData = JSON.parse(savedEventData);
                lockAllBoxes(savedData.boxId, savedData.prize);
            }
        };

        function verifyAndStart() {
            document.getElementById('verify-screen').style.display = 'none';
            processGameScreenAccess();
        }

        function showGameScreen() {
            document.getElementById('verify-screen').style.display = 'none';
            processGameScreenAccess();
        }

        function processGameScreenAccess() {
            document.getElementById('game-screen').style.display = 'block';
        }

        const boxes = document.querySelectorAll('.box');
        boxes.forEach(box => {
            box.addEventListener('click', function() {
                if (box.classList.contains('locked')) {
                    const target = box.getAttribute('data-target');
                    alert(`🔒 Ye box locked hai! Yeh box tab khulega jab Instagram par ${target} followers ho jayenge.`);
                    return;
                }

                if (localStorage.getItem('mysteryBoxPlayed_' + CURRENT_EVENT_ID)) return;

                const boxId = box.getAttribute('data-id');
                const prizeObj = getLevelBasedPrize();

                localStorage.setItem('mysteryBoxPlayed_' + CURRENT_EVENT_ID, JSON.stringify({ boxId, prize: prizeObj.name }));

                lockAllBoxes(boxId, prizeObj.name);
            });
        });

        function lockAllBoxes(selectedId, prize) {
            boxes.forEach(b => {
                b.classList.add('open');
                if(b.getAttribute('data-id') === selectedId) {
                    b.style.border = "2px solid var(--accent-color)";
                }
            });

            const resultMsg = document.getElementById('result-message');
            const actionArea = document.getElementById('action-area');

            if (!prize.includes("Better Luck")) {
                resultMsg.innerHTML = `🎉 Badhai Ho! Aapne jeeta hai:<br><b style="color:#ffcc00; font-size:18px;">${prize}</b>`;
                
                const shareText = encodeURIComponent(`🔥 15 September 2026 Mystery Box Giveaway mein "${prize}" jeet liya hai! 🎁\n\nApna bhi kismat aazmao: https://t.me/${TELEGRAM_CHANNEL_USERNAME}`);
                const shareUrl = `https://t.me/share/url?url=${shareText}`;

                actionArea.innerHTML = `
                    <div class="action-btns">
                        <a href="${shareUrl}" target="_blank" class="share-btn">📢 Share Result to Telegram Channel</a>
                        <a href="${INSTAGRAM_URL}" target="_blank" class="claim-btn">💬 DM on Instagram to Claim the Prize</a>
                    </div>
                `;
            } else {
                resultMsg.textContent = `😢 Better Luck Next Time! Box #${selectedId} mein kuch nahi nikla.`;
                actionArea.innerHTML = "";
            }
        }
    </script>
</body>
</html>
