<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Box Challenge</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 20px auto; }
        .box { background: #ff9800; border: none; padding: 25px 0; font-size: 24px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
        .box:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #4caf50; }
    </style>
</head>
<body>
    <h2>🎁 Choose 1 Mystery Box</h2>
    <div class="grid" id="boxGrid"></div>
    <div id="result"></div>

    <script>
        const rewards = [
            "🎉 You won ₹500 Cash!", "😢 Better luck next time!", "🎉 You won ₹100 Recharge!",
            "😢 Empty Box!", "🎉 Grand Prize: Smartwatch!", "😢 Better luck next time!",
            "🎉 You won ₹50 Cashback!", "😢 Empty Box!", "🎉 You won ₹200 Amazon Gift Card!"
        ];

        const grid = document.getElementById("boxGrid");
        const resultDiv = document.getElementById("result");
        const hasPlayed = localStorage.getItem("played_box");

        for (let i = 0; i < 9; i++) {
            let btn = document.createElement("button");
            btn.className = "box";
            btn.innerText = "📦 " + (i + 1);
            btn.onclick = () => openBox(i);
            if (hasPlayed !== null) {
                btn.disabled = true;
                if (hasPlayed == i) {
                    btn.innerText = "OPEN";
                    resultDiv.innerHTML = "Aapne ye box chuna tha:<br>" + rewards[i];
                }
            }
            grid.appendChild(btn);
        }

        function openBox(index) {
            localStorage.setItem("played_box", index);
            document.querySelectorAll(".box").forEach(b => b.disabled = true);
            resultDiv.innerHTML = "Aapka Inaam:<br>" + rewards[index];
        }
    </script>
</body>
</html>
